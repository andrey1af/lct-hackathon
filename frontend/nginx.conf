worker_processes  auto;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # API живёт на том же адресе, что и страница: без этого POST /api/... уходит
        # в try_files и статика отвечает 405. Host передаём как $http_host, вместе с
        # портом: CORS-мидлварь сверяет Origin с r.Host, а $host порт отбрасывает,
        # и на localhost:3000 свой же запрос получал 403 origin_forbidden.
        # Имя api резолвится на каждый запрос через встроенный DNS Docker,
        # поэтому nginx стартует и без запущенного бэкенда.
        resolver 127.0.0.11 valid=10s ipv6=off;

        location ^~ /api/ {
            set $api http://api:8090;
            proxy_pass $api$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /auth/ {
            set $api http://api:8090;
            proxy_pass $api$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /health/ {
            set $api http://api:8090;
            proxy_pass $api$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /openapi.yaml {
            set $api http://api:8090;
            proxy_pass $api$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /swagger {
            set $api http://api:8090;
            proxy_pass $api$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
